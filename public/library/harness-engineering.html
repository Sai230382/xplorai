<style>

  .grad-bar{height:26px; border:1px solid var(--line); border-radius:4px; background:var(--panel); display:flex; align-items:center; padding:0 12px; font:500 11.5px/1 var(--mono); color:var(--dim); letter-spacing:.04em}

<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
import * as THREE from 'three';

const { useState, useEffect, useRef, useMemo } = React;
const html = htm.bind(React.createElement);

/* =========================================================================
   0. palette + tiny helpers
   ========================================================================= */
const HEX = {
  fg:0xe7e9ec, dim:0x8d939d, faint:0x5d636d,
  blue:0x6fb3ff, green:0x3ecf8e, amber:0xe0a33d, red:0xe5645e, violet:0xa58bff,
  dead:0x2a2e35, panel:0x111419
};
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const TAU = Math.PI*2;

/* =========================================================================
   1. three.js plumbing: a tiny orbit stage + canvas text sprites
   ========================================================================= */
function createStage(opts){
  const o = Object.assign({ cameraZ:7, fov:42, phi:Math.PI/2-0.30, theta:0.55, autoRotate:0.10, target:[0,0,0] }, opts||{});
  const mount = o.mount;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(o.fov, 1, 0.1, 400);
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setClearColor(0x000000, 0);
  mount.appendChild(renderer.domElement);
  renderer.domElement.style.display='block';

  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  const key = new THREE.DirectionalLight(0xffffff, 1.45); key.position.set(4,6,7); scene.add(key);
  const rim = new THREE.DirectionalLight(0x6fb3ff, 0.85); rim.position.set(-6,-3,-5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-2,5,-6); scene.add(fill);

  const st = { theta:o.theta, phi:o.phi, dist:o.cameraZ, drag:false, px:0, py:0, moved:false };
  const tgt = new THREE.Vector3(o.target[0], o.target[1], o.target[2]);

  function place(){
    const sp = Math.sin(st.phi);
    camera.position.set(
      tgt.x + st.dist * sp * Math.sin(st.theta),
      tgt.y + st.dist * Math.cos(st.phi),
      tgt.z + st.dist * sp * Math.cos(st.theta)
    );
    camera.lookAt(tgt);
  }
  place();

  const el = renderer.domElement;
  const down = (e)=>{ st.drag=true; st.moved=false; st.px=e.clientX; st.py=e.clientY; el.setPointerCapture&&el.setPointerCapture(e.pointerId); };
  const move = (e)=>{
    if(!st.drag) return;
    const dx=e.clientX-st.px, dy=e.clientY-st.py;
    st.px=e.clientX; st.py=e.clientY;
    if(Math.abs(dx)+Math.abs(dy)>2) st.moved=true;
    st.theta -= dx*0.006;
    st.phi = clamp(st.phi - dy*0.005, 0.22, Math.PI-0.22);
    place();
  };
  const up = (e)=>{ st.drag=false; try{el.releasePointerCapture(e.pointerId)}catch(_){} };
  el.addEventListener('pointerdown', down);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  el.addEventListener('touchmove', (e)=>e.preventDefault(), {passive:false});

  const ro = new ResizeObserver(()=>{
    const w = mount.clientWidth||1, h = mount.clientHeight||1;
    renderer.setSize(w,h,false);
    el.style.width='100%'; el.style.height='100%';
    camera.aspect = w/h; camera.updateProjectionMatrix();
  });
  ro.observe(mount);

  let frameFn = null, raf = 0, last = performance.now();
  function tick(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    if(!st.drag) st.theta += o.autoRotate*dt;
    place();
    if(frameFn) frameFn(dt, (now)/1000);
    renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  return {
    THREE, scene, camera, renderer, state:st,
    setFrame(fn){ frameFn = fn; },
    destroy(){
      cancelAnimationFrame(raf); ro.disconnect();
      el.removeEventListener('pointerdown', down);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      scene.traverse(n=>{
        if(n.geometry) n.geometry.dispose();
        if(n.material){ (Array.isArray(n.material)?n.material:[n.material]).forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); }); }
      });
      renderer.dispose();
      if(el.parentNode) el.parentNode.removeChild(el);
    }
  };
}

function makeLabel(text, o){
  o = o||{};
  const color = o.color || '#dfe3e8';
  const size  = o.size  || 46;
  const weight= o.weight|| 600;
  const pad   = 16;
  const worldH= o.worldH|| 0.30;
  const cv = document.createElement('canvas');
  let ctx = cv.getContext('2d');
  const font = weight+' '+size+'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + pad*2;
  const h = Math.ceil(size*1.42);
  cv.width = w; cv.height = h;
  ctx = cv.getContext('2d');
  ctx.font = font;
  if(o.bg){ ctx.fillStyle=o.bg; ctx.fillRect(0,0,w,h); }
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  if(o.track!==undefined){ ctx.letterSpacing = o.track+'px'; }
  ctx.fillText(text, pad, h/2 + 1);
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false, depthWrite:false }));
  sp.scale.set(worldH*(w/h), worldH, 1);
  sp.renderOrder = 10;
  return sp;
}

function mesh(geo, color, o){
  o = o||{};
  const m = new THREE.MeshStandardMaterial({
    color: color,
    roughness: o.rough!==undefined?o.rough:0.42,
    metalness: o.metal!==undefined?o.metal:0.10,
    emissive: o.emissive!==undefined?o.emissive:0x000000,
    emissiveIntensity: o.ei!==undefined?o.ei:0.6,
    transparent: !!o.opacity,
    opacity: o.opacity!==undefined?o.opacity:1,
    flatShading: !!o.flat
  });
  return new THREE.Mesh(geo, m);
}
function edges(geo, color, opacity){
  const l = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color:color, transparent:true, opacity:opacity!==undefined?opacity:0.55 })
  );
  return l;
}

/* =========================================================================
   2. React <-> three bridge
   ========================================================================= */
function ThreeCanvas(props){
  const mountRef = useRef(null);
  const handleRef = useRef(null);
  useEffect(()=>{
    let alive = true;
    const h = props.setup(mountRef.current);
    handleRef.current = h;
    return ()=>{ alive=false; if(handleRef.current && handleRef.current.destroy) handleRef.current.destroy(); handleRef.current=null; };
  }, []);
  useEffect(()=>{
    const h = handleRef.current;
    if(h && h.update) h.update(props.value);
  }, [props.value]);
  return html`<div className="three" ref=${mountRef} style=${props.style||{}}>
    <div className="three-hint">drag to rotate</div>
  </div>`;
}

/* =========================================================================
   3. SCENE A — model core inside the harness shell
   ========================================================================= */
function sceneKernel(mount){
  const S = createStage({ mount, cameraZ:7.6, fov:40, phi:Math.PI/2-0.22, theta:0.6, autoRotate:0.10 });
  const { scene } = S;
  const root = new THREE.Group(); scene.add(root);

  // --- the model: a dense faceted core
  const core = mesh(new THREE.IcosahedronGeometry(1.25, 1), 0x0d1a28, { emissive:HEX.blue, ei:0.75, flat:true, rough:0.35 });
  root.add(core);
  const coreEdge = edges(new THREE.IcosahedronGeometry(1.26, 1), HEX.blue, 0.75);
  root.add(coreEdge);
  const halo = mesh(new THREE.IcosahedronGeometry(1.62, 2), 0x6fb3ff, { emissive:HEX.blue, ei:0.5, opacity:0.055, rough:1 });
  root.add(halo);

  // --- the harness: three rings + a lattice boundary
  const rings = new THREE.Group(); root.add(rings);
  const ringSpec = [[2.35, 0.014, HEX.green], [2.05, 0.011, HEX.green], [2.65, 0.010, HEX.blue]];
  ringSpec.forEach(([r,t,c],i)=>{
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(r, t, 6, 160),
      new THREE.MeshStandardMaterial({ color:c, emissive:c, emissiveIntensity:0.9, transparent:true, opacity:0.85 })
    );
    ring.rotation.set(i===0?Math.PI/2:0, i===1?Math.PI/2.4:0, i===2?0.5:0.2);
    rings.add(ring);
  });

  // --- harness component nodes on the shell, wired back to the core
  const PARTS = ['CONTEXT','TOOLS','CONTROL','VERIFY','MEMORY','OBSERVE'];
  const nodes = new THREE.Group(); root.add(nodes);
  const nodePts = [];
  PARTS.forEach((name, i)=>{
    const a = (i/PARTS.length)*TAU + 0.3;
    const y = Math.sin(i*1.7)*0.55;
    const r = 2.35;
    const p = new THREE.Vector3(Math.cos(a)*r, y, Math.sin(a)*r);
    nodePts.push(p);
    const n = mesh(new THREE.BoxGeometry(0.20,0.20,0.20), 0x0f2a20, { emissive:HEX.green, ei:0.85, rough:0.4 });
    n.position.copy(p); nodes.add(n);
    const lb = makeLabel(name, { color:'#9fe7c4', size:40, worldH:0.235 });
    lb.position.copy(p).multiplyScalar(1.20); lb.position.y += 0.06;
    nodes.add(lb);
    // tether to the core
    const g = new THREE.BufferGeometry().setFromPoints([p.clone().multiplyScalar(0.24), p.clone().multiplyScalar(0.94)]);
    nodes.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color:HEX.green, transparent:true, opacity:0.3 })));
  });

  // --- lattice shell: dots on a sphere so the boundary reads as a surface
  const dotGeo = new THREE.BufferGeometry();
  const pts = [];
  const N = 420, R = 2.35;
  for(let i=0;i<N;i++){
    const u = Math.random(), v = Math.random();
    const th = TAU*u, ph = Math.acos(2*v-1);
    pts.push(R*Math.sin(ph)*Math.cos(th), R*Math.cos(ph), R*Math.sin(ph)*Math.sin(th));
  }
  dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  const dots = new THREE.Points(dotGeo, new THREE.PointsMaterial({ color:0x3a4756, size:0.022, transparent:true, opacity:0.55 }));
  root.add(dots);

  const coreLabel = makeLabel('MODEL', { color:'#cfe6ff', size:44, worldH:0.26 });
  coreLabel.position.set(0,-1.85,0); root.add(coreLabel);
  const shellLabel = makeLabel('HARNESS', { color:'#9fe7c4', size:44, worldH:0.26 });
  shellLabel.position.set(0,2.95,0); root.add(shellLabel);

  S.setFrame((dt,t)=>{
    core.rotation.y += dt*0.22; core.rotation.x += dt*0.07;
    coreEdge.rotation.copy(core.rotation);
    halo.rotation.y -= dt*0.05;
    rings.children.forEach((r,i)=>{
      r.rotation.x += dt*(0.09+i*0.03);
      r.rotation.y += dt*(0.13-i*0.02);
    });
    const pulse = 0.72 + Math.sin(t*1.4)*0.16;
    core.material.emissiveIntensity = pulse;
    dots.rotation.y += dt*0.03;
  });
  return S;
}

/* =========================================================================
   4. SCENE B — the control loop, in three quality modes
   ========================================================================= */
const LOOP_NODES = ['INTENT','CONTEXT','MODEL','TOOLS','VERIFY','MEMORY'];
const LOOP_MODES = {
  bad:  { active:[0,1,2],    arcs:[0,1],       ret:false },
  ok:   { active:[0,1,2,3],  arcs:[0,1,2,3],   ret:false },
  good: { active:[0,1,2,3,4,5], arcs:[0,1,2,3,4,5], ret:true }
};
function sceneLoop(mount){
  const S = createStage({ mount, cameraZ:8.4, fov:40, phi:0.78, theta:0.0, autoRotate:0.11, target:[0,0,0] });
  const { scene } = S;
  const root = new THREE.Group(); scene.add(root);
  const R = 2.75, STEP = TAU/LOOP_NODES.length;

  const nodeMeshes = [], arcMeshes = [], labels = [];
  LOOP_NODES.forEach((name,i)=>{
    const a = -Math.PI/2 + i*STEP;
    const p = new THREE.Vector3(Math.cos(a)*R, 0, Math.sin(a)*R);
    const b = mesh(new THREE.BoxGeometry(1.02,0.34,0.62), HEX.panel, { emissive:HEX.blue, ei:0.3, rough:0.45 });
    b.position.copy(p);
    b.lookAt(0,0,0);
    root.add(b); nodeMeshes.push(b);
    const lb = makeLabel(name, { color:'#dfe3e8', size:40, worldH:0.27 });
    lb.position.set(p.x*1.30, 0.52, p.z*1.30);
    root.add(lb); labels.push(lb);
  });

  // arcs between consecutive nodes
  for(let i=0;i<LOOP_NODES.length;i++){
    const a0 = -Math.PI/2 + i*STEP, a1 = a0 + STEP;
    const curve = new THREE.CatmullRomCurve3(
      Array.from({length:14},(_,k)=>{
        const a = lerp(a0,a1,k/13);
        return new THREE.Vector3(Math.cos(a)*R, 0, Math.sin(a)*R);
      })
    );
    const m = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 26, 0.017, 6, false),
      new THREE.MeshStandardMaterial({ color:HEX.dead, emissive:0x000000, emissiveIntensity:0.6, transparent:true, opacity:0.9 })
    );
    root.add(m); arcMeshes.push(m);

    // direction cone
    const am = a0 + STEP*0.5;
    const tangent = new THREE.Vector3(-Math.sin(am),0,Math.cos(am)).normalize();
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.075, 0.20, 8),
      new THREE.MeshStandardMaterial({ color:HEX.dead, emissive:0x000000, emissiveIntensity:0.5 })
    );
    cone.position.set(Math.cos(am)*R, 0.0, Math.sin(am)*R);
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), tangent);
    root.add(cone);
    if(!arcMeshes[i].userData) arcMeshes[i].userData = {};
    arcMeshes[i].userData.cone = cone;
  }

  // the return / feedback path: VERIFY -> CONTEXT  (only exists in a good harness)
  const vA = -Math.PI/2 + 4*STEP, cA = -Math.PI/2 + 1*STEP;
  const pv = new THREE.Vector3(Math.cos(vA)*R, 0, Math.sin(vA)*R);
  const pc = new THREE.Vector3(Math.cos(cA)*R, 0, Math.sin(cA)*R);
  const mid = new THREE.Vector3(0, 0.05, 0).add(pv.clone().add(pc).multiplyScalar(0.18));
  const retCurve = new THREE.CatmullRomCurve3([pv, pv.clone().lerp(mid,0.5).setY(0.35), mid, pc.clone().lerp(mid,0.5).setY(0.35), pc]);
  const retMesh = new THREE.Mesh(
    new THREE.TubeGeometry(retCurve, 60, 0.018, 6, false),
    new THREE.MeshStandardMaterial({ color:HEX.green, emissive:HEX.green, emissiveIntensity:1.0, transparent:true, opacity:0.0 })
  );
  root.add(retMesh);
  const retLabel = makeLabel('FEEDBACK', { color:'#9fe7c4', size:34, worldH:0.20 });
  retLabel.position.set(0.15, 0.62, 0.15);
  retLabel.material.opacity = 0; root.add(retLabel);

  // the travelling task
  const pulse = mesh(new THREE.SphereGeometry(0.115, 20, 16), 0xffffff, { emissive:0xffffff, ei:1.4, rough:0.2 });
  root.add(pulse);
  const glow = mesh(new THREE.SphereGeometry(0.24, 20, 16), 0xffffff, { emissive:0xffffff, ei:0.5, opacity:0.10, rough:1 });
  root.add(glow);

  let mode = 'good', p = 0, target = LOOP_MODES.good;
  function applyMode(m){
    mode = m; target = LOOP_MODES[m];
    const act = new Set(target.active);
    nodeMeshes.forEach((b,i)=>{
      const on = act.has(i);
      b.userData.on = on;
    });
    arcMeshes.forEach((a,i)=>{ a.userData.on = target.arcs.indexOf(i)>=0; });
    retMesh.userData.on = target.ret;
    retLabel.userData.on = target.ret;
  }
  applyMode('good');

  const setColor = (m, hex, ei, op)=>{
    m.material.color.setHex(hex);
    m.material.emissive.setHex(hex===HEX.dead?0x000000:hex);
    m.material.emissiveIntensity = ei;
    if(op!==undefined) m.material.opacity = op;
  };

  S.setFrame((dt,t)=>{
    const act = new Set(target.active);
    nodeMeshes.forEach((b,i)=>{
      const on = act.has(i);
      const cur = b.userData.k===undefined?0:b.userData.k;
      b.userData.k = lerp(cur, on?1:0, 1-Math.pow(0.001,dt));
      const k = b.userData.k;
      if(on) setColor(b, HEX.blue, 0.18+0.30*k);
      else   setColor(b, HEX.dead, 0.0);
      labels[i].material.opacity = 0.28 + 0.72*k;
    });
    arcMeshes.forEach((a,i)=>{
      const on = a.userData.on;
      const cur = a.userData.k===undefined?0:a.userData.k;
      a.userData.k = lerp(cur, on?1:0, 1-Math.pow(0.002,dt));
      const k = a.userData.k;
      setColor(a, on?HEX.blue:HEX.dead, k*0.9, 0.35+0.55*k);
      const c = a.userData.cone;
      setColor(c, on?HEX.blue:HEX.dead, k*0.9, 0.35+0.55*k);
    });
    const rk = lerp(retMesh.userData.k===undefined?0:retMesh.userData.k, retMesh.userData.on?1:0, 1-Math.pow(0.002,dt));
    retMesh.userData.k = rk;
    retMesh.material.opacity = rk*0.95;
    retLabel.material.opacity = rk;

    // advance the pulse along the active arcs
    const arcs = target.arcs;
    p += dt*0.85;
    if(p >= arcs.length) p -= arcs.length;
    const ai = arcs[Math.min(arcs.length-1, Math.floor(p))];
    const lt = p - Math.floor(p);
    const a0 = -Math.PI/2 + ai*STEP;
    const a = a0 + lt*STEP;
    const bounce = Math.sin(lt*Math.PI)*0.16;
    pulse.position.set(Math.cos(a)*R, bounce, Math.sin(a)*R);
    glow.position.copy(pulse.position);
    const c = mode==='good'?0x9fe7c4 : mode==='ok'?0xcfe0f5 : 0xe5645e;
    pulse.material.emissive.setHex(c); pulse.material.color.setHex(0xffffff);
    glow.material.emissive.setHex(c);
  });

  return { update:(v)=>applyMode(v), destroy:S.destroy };
}

/* =========================================================================
   5. SCENE C — the component matrix: bad / ok / good
   ========================================================================= */
const TIERS = ['BAD','OK','GOOD'];
const COMPONENTS = [
  { key:'CONTEXT',  lv:[0,1,2] },
  { key:'TOOLS',    lv:[0,1,2] },
  { key:'CONTROL',  lv:[0,1,2] },
  { key:'VERIFY',   lv:[0,1,2] },
  { key:'MEMORY',   lv:[0,1,2] },
  { key:'ERRORS',   lv:[0,0,2] },
  { key:'PARALLEL', lv:[0,0,2] },
  { key:'OBSERVE',  lv:[0,1,2] },
  { key:'SAFETY',   lv:[0,1,2] },
  { key:'BUDGET',   lv:[0,0,2] },
  { key:'EVALS',    lv:[0,1,2] }
];
const LV_COLOR = [HEX.dead, HEX.amber, HEX.green];
const LV_W     = [0.12, 1.05, 1.95];

function sceneTiers(mount, opts){
  const pickRef = opts.pickRef, selRef = opts.selRef;
  const S = createStage({ mount, cameraZ:11.4, fov:40, phi:Math.PI/2-0.10, theta:0.30, autoRotate:0.055, target:[0,0,0] });
  const { scene } = S;
  const root = new THREE.Group(); scene.add(root);

  const COLW = 2.55, ROWH = 0.60;
  const yTop = ((COMPONENTS.length-1)*ROWH)/2;

  // column headers
  TIERS.forEach((t,i)=>{
    const c = i===0?HEX.red : i===1?HEX.amber : HEX.green;
    const lb = makeLabel(t, { color:'#'+c.toString(16).padStart(6,'0'), size:46, worldH:0.30 });
    lb.position.set((i-1)*COLW, yTop+0.68, 0);
    root.add(lb);
  });

  // rows
  const bars = [];
  COMPONENTS.forEach((comp, r)=>{
    const y = yTop - r*ROWH;
    const lb = makeLabel(comp.key, { color:'#8d939d', size:38, worldH:0.225 });
    lb.position.set(-4.55, y, 0);
    root.add(lb);

    comp.lv.forEach((lv, c)=>{
      const x0 = (c-1)*COLW - 0.98;
      const w = LV_W[lv];
      const g = new THREE.BoxGeometry(Math.max(w,0.10), 0.30, 0.42);
      const m = mesh(g, LV_COLOR[lv], { emissive:LV_COLOR[lv], ei: lv===0?0.05:0.45, rough:0.4 });
      m.position.set(x0 + w/2, y, 0);
      m.userData = { r, c, lv, comp:comp.key, base:LV_COLOR[lv], ei: lv===0?0.05:0.45 };
      root.add(m); bars.push(m);
      const e = edges(g, lv===0?0x3a3f48:LV_COLOR[lv], lv===0?0.5:0.35);
      e.position.copy(m.position); root.add(e);
      m.userData.edge = e;
    });
  });

  // picking
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const el = S.renderer.domElement;
  function pick(ev){
    const r = el.getBoundingClientRect();
    ndc.x = ((ev.clientX-r.left)/r.width)*2-1;
    ndc.y = -((ev.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(ndc, S.camera);
    const hit = ray.intersectObjects(bars, false)[0];
    if(hit){ pickRef.current && pickRef.current(hit.object.userData.r, hit.object.userData.c); }
  }
  el.addEventListener('pointerdown', (e)=>{ S.state.moved=false; });
  el.addEventListener('pointerup', (e)=>{ if(!S.state.moved && !S.state.drag) pick(e); });
  el.addEventListener('click', (e)=>{ if(!S.state.moved) pick(e); });

  S.setFrame((dt,t)=>{
    const sel = selRef.current || { r:3, c:2 };
    bars.forEach(b=>{
      const isSel = b.userData.r===sel.r && b.userData.c===sel.c;
      const isRow = b.userData.r===sel.r;
      const tgt = isSel ? 1.25 : (isRow ? 0.55 : b.userData.ei);
      b.material.emissiveIntensity = lerp(b.material.emissiveIntensity, tgt, 1-Math.pow(0.002,dt));
      const s = isSel ? 1.16 : 1.0;
      b.scale.z = lerp(b.scale.z, s, 1-Math.pow(0.002,dt));
      b.scale.y = lerp(b.scale.y, s, 1-Math.pow(0.002,dt));
      if(b.userData.edge) b.userData.edge.material.opacity = isSel?0.95:(isRow?0.6:0.3);
    });
    root.position.y = Math.sin(t*0.35)*0.03;
  });

  return { update:()=>{}, destroy:S.destroy };
}

/* =========================================================================
   6. SCENE D — the context window as a budget
   ========================================================================= */
const CTX_SEGS = [
  { key:'SYSTEM',    c:0x6fb3ff, bad:0.55, good:0.40 },
  { key:'TOOLS',     c:0xa58bff, bad:0.85, good:0.32 },
  { key:'RETRIEVED', c:0xe0a33d, bad:2.10, good:0.85 },
  { key:'HISTORY',   c:0x3ecf8e, bad:1.30, good:0.60 },
  { key:'RESERVE',   c:0xe5645e, bad:0.12, good:1.05 }
];
const CTX_MAX = 5.0;
function sceneContext(mount){
  const S = createStage({ mount, cameraZ:9.2, fov:38, phi:Math.PI/2-0.12, theta:0.42, autoRotate:0.09, target:[0,0,0] });
  const { scene } = S;
  const root = new THREE.Group(); scene.add(root);

  // the window: a wireframe column
  const frameGeo = new THREE.BoxGeometry(1.7, CTX_MAX, 1.7);
  const frame = edges(frameGeo, 0x39404b, 0.85);
  frame.position.y = 0.2; root.add(frame);
  const base = new THREE.Mesh(
    new THREE.PlaneGeometry(1.7,1.7),
    new THREE.MeshBasicMaterial({ color:0x6fb3ff, transparent:true, opacity:0.05 })
  );
  base.rotation.x = -Math.PI/2; base.position.y = 0.2 - CTX_MAX/2; root.add(base);

  const slabs = CTX_SEGS.map(s=>{
    const m = mesh(new THREE.BoxGeometry(1.42, 1, 1.42), s.c, { emissive:s.c, ei:0.32, rough:0.45 });
    root.add(m);
    const lb = makeLabel(s.key, { color:'#'+s.c.toString(16).padStart(6,'0'), size:36, worldH:0.215 });
    root.add(lb);
    return { m, lb, h:0.4, th:0.4 };
  });

  let mode='bad';
  function apply(m){ mode=m; slabs.forEach((s,i)=>{ s.th = m==='bad'?CTX_SEGS[i].bad:CTX_SEGS[i].good; }); }
  apply('bad');

  S.setFrame((dt)=>{
    let y = -CTX_MAX/2 + 0.2;
    slabs.forEach((s,i)=>{
      s.h = lerp(s.h, s.th, 1-Math.pow(0.004,dt));
      const h = Math.max(s.h, 0.02);
      s.m.scale.y = h;
      s.m.position.y = y + h/2;
      s.lb.position.set(1.55, y + h/2, 0);
      y += h;
    });
  });
  return { update:apply, destroy:S.destroy };
}

const Seg = (props)=> html`
  <div className="seg" key=${props.key}>
    ${props.options.map(o=>html`
      <button key=${o.v}
        className=${(props.value===o.v ? 'on '+(o.tone||'') : '')}
        onClick=${()=>props.onChange(o.v)}>${o.label}</button>`)}
  </div>`;

function Radar(props){
  const dims = SCORE_DIMS.length;
  const cx=260, cy=220, R=140;
  const pt = (i, r)=>{
    const a = -Math.PI/2 + (i/dims)*TAU;
    return [cx + Math.cos(a)*R*r, cy + Math.sin(a)*R*r];
  };
  const rings = [0.25,0.5,0.75,1].map(r=>{
    const d = Array.from({length:dims},(_,i)=>pt(i,r).map(n=>n.toFixed(1)).join(',')).join(' ');
    return html`<polygon key=${r} points=${d} fill="none" stroke="#22262e" stroke-width="1"/>`;
  });
  const spokes = Array.from({length:dims},(_,i)=>{
    const [x,y]=pt(i,1);
    return html`<line key=${i} x1=${cx} y1=${cy} x2=${x.toFixed(1)} y2=${y.toFixed(1)} stroke="#22262e" stroke-width="1"/>`;
  });
  const poly = props.values.map((v,i)=>pt(i, 0.08 + (v/10)*0.92).map(n=>n.toFixed(1)).join(',')).join(' ');
  const dots = props.values.map((v,i)=>{
    const [x,y]=pt(i, 0.08 + (v/10)*0.92);
    return html`<circle key=${i} cx=${x.toFixed(1)} cy=${y.toFixed(1)} r="3" fill="#6fb3ff"/>`;
  });
  const labels = SCORE_DIMS.map((d,i)=>{
    const [x,y]=pt(i,1.22);
    const anchor = Math.abs(x-cx)<22 ? 'middle' : (x>cx?'start':'end');
    return html`<text key=${i} x=${x.toFixed(1)} y=${(y+4).toFixed(1)} text-anchor=${anchor}
      font-family="ui-monospace, Menlo, monospace" font-size="9.5" letter-spacing="0.6"
      fill="#8d939d">${d[0].toUpperCase()}</text>`;
  });
  return html`<svg width="460" height="420" viewBox="0 0 520 460">
    ${rings}${spokes}
    <polygon points=${poly} fill="rgba(111,179,255,0.16)" stroke="#6fb3ff" stroke-width="1.6"/>
    ${dots}${labels}
  </svg>`;
}

      <div className="note">Autonomy should follow verification, never lead it. Where the checks are strong you can let the model run; where they are absent, keep it on a short leash. <b>A cheap check beats a longer prompt, every time.</b></div>
    </div>
  <//>`;
}

/* ---- 15. scorecard ---- */
function S15(){
  const [v, setV] = useState([4,5,3,4,3,4,5,3]);
  const score = Math.round(v.reduce((s,x)=>s+x,0)/v.length*10);
  const tone = score<45?'r':score<72?'a':'g';
  const label = score<45?'BAD HARNESS':score<72?'OK HARNESS':'GOOD HARNESS';
  const color = score<45?'var(--red)':score<72?'var(--amber)':'var(--green)';
  const lowest = v.indexOf(Math.min.apply(null,v));
  return html`<${SlideShell} id="s15" kicker="14 — SCORECARD" title="Score your own harness"
    lead=${html`Move the sliders honestly. The lowest bar is the one to fix next — the rest do not matter until it moves.`}>
    <div className="radar-wrap" style=${{width:'100%'}}>
      <${Radar} values=${v} />
      <div>
        <div className="sliders">
          ${SCORE_DIMS.map((d,i)=>html`
            <div className="sl" key=${d[0]}>
              <label title=${d[1]}>${d[0]}</label>
              <input type="range" min="0" max="10" step="1" value=${v[i]}
                onInput=${(e)=>{ const n=v.slice(); n[i]=+e.target.value; setV(n); }} />
              <output>${v[i]}</output>
            </div>`)}
        </div>
        <div style=${{marginTop:18, display:'flex', alignItems:'flex-end', gap:18}}>
          <div>
            <div className="score" style=${{color:color}}>${score}</div>
            <div className="verdict" style=${{color:color}}>${label}</div>
          </div>
          <div style=${{flex:1, paddingBottom:4}}>
            <div style=${{font:'600 10.5px/1 var(--mono)', letterSpacing:'.1em', color:'var(--faint)', marginBottom:6}}>WEAKEST LINK</div>
            <div style=${{font:'600 12px/1.4 var(--mono)', color:'var(--fg)'}}>${SCORE_DIMS[lowest][0].toUpperCase()}</div>
            <div style=${{fontSize:12.5, lineHeight:1.55, color:'var(--dim)', marginTop:4}}>${SCORE_DIMS[lowest][1]}</div>
          </div>
        </div>
      </div>
    </div>
  <//>`;
}

/* ---- 16. what to build first ---- */
function S16(){
  return html`<${SlideShell} id="s16" kicker="15 — ORDER OF OPERATIONS" title="If you are starting from a prompt, build in this order"
    lead=${html`The instinct is to start with prompts and finish with evals. That order is backwards, and it is why harness work stalls.`}>
    <div className="col grow" style=${{gap:0}}>
      ${[
        ['1','Evals first','Twenty real tasks with a pass/fail you trust. Without this you cannot tell improvement from noise, and every later decision is a guess.'],
        ['2','Observability','A replayable trace of every run. You cannot fix what you cannot watch, and you will not guess the real failure mode correctly.'],
        ['3','Verification','Wire the checks that already exist — build, tests, schema validation. This single step usually moves results more than any prompt change.'],
        ['4','Tool surface','Cut the tool list in half, rewrite every description, and make error messages teach. Delete before you add.'],
        ['5','Context discipline','Measure the window composition. Prune, compress, reserve room for output, re-assemble each turn.'],
        ['6','Control flow','Plan, stuck detection, budgets, rollback. Now that it can be checked, let it run longer.'],
        ['7','Prompts last','By this point the system prompt is short, because everything it used to say now lives in code.']

          <div style=${{font:'600 13px/1.5 var(--mono)', color:'var(--fg)', letterSpacing:'.04em'}}>${t}</div>

        </div>`)}

  <//>`;
}

function S17(){

    <div className="col grow takes" style=${{maxWidth:1000}}>

/* =========================================================================
   10. app + navigation
   ========================================================================= */
function App(){
  const params = typeof location!=='undefined' ? new URLSearchParams(location.search) : null;
  const start = Math.max(0, Math.min(SLIDES.length-1, parseInt(params && params.get('s')) || 0));
  const [i, setI] = useState(start - 1 >= 0 ? start : 0);
  useEffect(()=>{ if(start>=0) setI(start); }, []);
  const n = SLIDES.length;
  const go = (k)=>setI(clamp(k,0,n-1));

  useEffect(()=>{
    const onKey = (e)=>{
      if(e.target && /input|textarea/i.test(e.target.tagName)) {
        if(e.key==='ArrowLeft'||e.key==='ArrowRight') e.target.blur();
        return;
      }
      if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown') { e.preventDefault(); go(i+1); }
      else if(e.key==='ArrowLeft'||e.key==='PageUp') { e.preventDefault(); go(i-1); }
      else if(e.key==='Home') go(0);
      else if(e.key==='End') go(n-1);
    };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  }, [i]);

  useEffect(()=>{
    const fit = ()=>{
      const s = Math.min(window.innerWidth/1280, window.innerHeight/720);
      const st = document.getElementById('stage');
      if(st) st.style.transform = 'scale('+s+')';
    };
    fit(); window.addEventListener('resize', fit);
    return ()=>window.removeEventListener('resize', fit);
  }, []);

  const Cur = SLIDES[i].f;
  return html`<div style=${{position:'absolute', inset:0}}>
    <${Cur} key=${i} />
    <div id="nav">
      <div className="num">${String(i+1).padStart(2,'0')} / ${n}</div>
      <div className="dots">
        ${SLIDES.map((s,k)=>html`<button className=${'dot'+(k===i?' on':'')} key=${k}
          title=${s.t} onClick=${()=>go(k)} aria-label=${s.t}></button>`)}
      </div>
      <div className="title">${SLIDES[i].t.toUpperCase()}</div>
      <div className="arrows">
        <button onClick=${()=>go(i-1)} title="previous">←</button>
        <button onClick=${()=>go(i+1)} title="next">→</button>
      </div>
    </div>
  </div>`;
}

const boot = document.getElementById('boot');
createRoot(document.getElementById('stage')).render(html`<${App} />`);
window.__booted = true;
if(boot && boot.parentNode) boot.parentNode.removeChild(boot);
</script>
