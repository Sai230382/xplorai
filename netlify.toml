[build]
  command = "npm run build"
  publish = "dist"

# Existing files in dist (robots.txt, sitemap.xml, og.jpg, and so on) are served first.

[[redirects]]
  from = "/doors"
  to = "/"
  status = 301

[[redirects]]
  from = "/doors/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/academy"
  to = "/"
  status = 301

[[redirects]]
  from = "/academy/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/playbook"
  to = "/"
  status = 301

[[redirects]]
  from = "/playbook/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/library"
  to = "/"
  status = 301

[[redirects]]
  from = "/library/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
